services:
  db:
    image: postgres:16-alpine
    container_name: cyberguard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cyberguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyberguard_secret}
      POSTGRES_DB: ${DB_NAME:-cyberguard_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyberguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguard_api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cyberguard}
      DB_PASSWORD: ${DB_PASSWORD:-cyberguard_secret}
      DB_NAME: ${DB_NAME:-cyberguard_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_a_long_random_string}
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
